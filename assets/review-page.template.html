<title>__CPR_PAGE_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one reading column of cards, each card split into content | decision;
     a marks rail beside it on wide screens; a fixed action bar at the bottom. */
  --bg:#F2F4F7;--surface:#FFFFFF;--surface-2:#F7F8FA;--surface-3:#E9EDF2;
  --ink:#15171E;--ink-2:#454A59;--ink-3:#687086;
  --line:#D3D9E2;--line-2:#E5E9EF;
  --accent:#2747C8;--accent-ink:#FFFFFF;--accent-bg:#E8EDFC;--accent-line:#AEBDF3;
  --ok:#136C34;--ok-bg:#E1F3E7;--ok-line:#9FD4B2;
  --chg:#7D4A00;--chg-bg:#FFF0D2;--chg-line:#E6BC6A;
  --drop:#A81F1F;--drop-bg:#FCE7E7;--drop-line:#E8A3A3;
  --paper:#FFFFFF;--scrim:rgba(12,14,20,.5);
  --shadow:0 1px 2px rgba(21,23,30,.06),0 10px 28px rgba(21,23,30,.10);
  --f-ui:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text:"IBM Plex Sans Hebrew","IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Arial Hebrew",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px;--r-s:5px;--dec-w:340px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1014;--surface:#171A20;--surface-2:#1C2028;--surface-3:#252A35;
    --ink:#E8EBF1;--ink-2:#B6BCCA;--ink-3:#8D94A7;
    --line:#2E3440;--line-2:#242934;
    --accent:#93A9FF;--accent-ink:#0E1014;--accent-bg:#1B2445;--accent-line:#3A4A8C;
    --ok:#6BD493;--ok-bg:#11301E;--ok-line:#235C3A;
    --chg:#F2BC5C;--chg-bg:#37280A;--chg-line:#6E5216;
    --drop:#F59090;--drop-bg:#3B1515;--drop-line:#7A2A2A;
    --paper:#FFFFFF;--scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1014;--surface:#171A20;--surface-2:#1C2028;--surface-3:#252A35;
  --ink:#E8EBF1;--ink-2:#B6BCCA;--ink-3:#8D94A7;
  --line:#2E3440;--line-2:#242934;
  --accent:#93A9FF;--accent-ink:#0E1014;--accent-bg:#1B2445;--accent-line:#3A4A8C;
  --ok:#6BD493;--ok-bg:#11301E;--ok-line:#235C3A;
  --chg:#F2BC5C;--chg-bg:#37280A;--chg-line:#6E5216;
  --drop:#F59090;--drop-bg:#3B1515;--drop-line:#7A2A2A;
  --paper:#FFFFFF;--scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grow{flex:1 1 auto;min-width:0}

/* ---------- frame ---------- */
.app{max-width:1600px;margin-inline:auto;padding-inline:16px;padding-block:22px 132px}
.layout{display:grid;grid-template-columns:minmax(0,1180px);justify-content:center;gap:28px;align-items:start}
.main{min-width:0}
.main.loading{opacity:.55;pointer-events:none}
.rail{display:none}
@media (min-width:1500px){
  .layout{grid-template-columns:minmax(0,1180px) 330px}
  .rail{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);max-height:calc(100vh - 118px);overflow:auto;
    border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px}
}

/* ---------- header ---------- */
.eyebrow{font:500 12px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow b{color:var(--accent);font-weight:500}
.h-title{font:600 30px/1.2 var(--f-text);margin-block:8px;letter-spacing:-.01em;overflow-wrap:anywhere}
.h-sum{margin-block-end:12px;color:var(--ink-2);font:400 16px/1.55 var(--f-text);max-width:80ch}
.facts{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 14px;padding:0;list-style:none}
.facts li{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:4px 9px;font-size:13px;display:flex;gap:6px;min-width:0}
.facts .fl{color:var(--ink-3);white-space:nowrap}
.facts .fv{font-family:var(--f-text);overflow-wrap:anywhere;min-width:0}
.howto{margin-block-end:12px;color:var(--ink-2);font-size:14px;max-width:92ch;text-align:start}
.planins{display:grid;gap:6px}
.planins label{font-weight:600;font-size:13px;text-align:start}

/* ---------- notices ---------- */
.notice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;margin-block:10px;font-size:14px;flex-wrap:wrap}
.notice > .ic{margin-top:2px}
.notice .ntext{flex:1 1 260px;min-width:0}
.notice .ntext b{font-weight:600}
.notice .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice.ok{border-color:var(--ok-line);background:var(--ok-bg)} .notice.ok > .ic,.notice.ok .ntext b{color:var(--ok)}
.notice.warn{border-color:var(--chg-line);background:var(--chg-bg)} .notice.warn > .ic,.notice.warn .ntext b{color:var(--chg)}
.notice.info{border-color:var(--accent-line);background:var(--accent-bg)} .notice.info > .ic,.notice.info .ntext b{color:var(--accent)}
.nstatus{font-size:13px;color:var(--ink-2);flex-basis:100%}

/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px;margin-block:8px 6px;border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding-block-end:8px}
.tab{appearance:none;border:1px solid transparent;border-radius:6px;background:transparent;padding:7px 12px;font-weight:500;color:var(--ink-2);white-space:nowrap;display:flex;gap:8px;align-items:center;flex:0 1 auto;min-width:0;max-width:280px}
.tab .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tab:hover{background:var(--surface-3)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.tab.is-gone .txt{text-decoration:line-through;color:var(--ink-3)}
.badge{font:500 11.5px/1 var(--f-mono);background:var(--chg-bg);color:var(--chg);border:1px solid var(--chg-line);border-radius:999px;padding:3px 6px}
.badge.q{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-line)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1 1 200px;min-width:0;max-width:320px}
.search input{width:100%;padding-block:7px;padding-inline:32px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.search .ic{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.fchip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex:none}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip .n{font:500 12px var(--f-mono);opacity:.85}
.nomatch{padding:28px 12px;text-align:center;color:var(--ink-3)}

/* ---------- buttons ---------- */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;display:inline-flex;gap:7px;align-items:center;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn.ghost{border-style:dashed;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface);border-style:solid}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--drop);border-color:var(--drop-line)}
.iconbtn{appearance:none;border:0;background:transparent;width:28px;height:28px;border-radius:5px;display:grid;place-items:center;color:var(--ink-3);flex:none;padding:0}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}

/* ---------- text ---------- */
.txt{font-family:var(--f-text);overflow-wrap:anywhere;white-space:pre-wrap;text-align:start}
.txt code{font:.92em var(--f-mono);background:var(--surface-3);padding:1px 5px;border-radius:4px;unicode-bidi:isolate;direction:ltr}
.ed{border-radius:5px;cursor:text;padding:2px 6px;margin-inline:-6px}
.ed:hover{background:var(--surface-3)}
.ed.is-empty{color:var(--ink-3);font-style:italic;font-weight:400}
.ed.is-locked{cursor:default}
.ed.is-locked:hover{background:transparent}
.ed[data-editing]{padding:0;background:transparent}
.edta{display:block;width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--accent);border-radius:5px;padding:1px 5px;resize:none;overflow:hidden;min-height:1.6em;outline:0}

/* ---------- panels ---------- */
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-3);margin-block:12px;min-width:0;scroll-margin-top:150px}
.panel-head{display:flex;align-items:center;gap:10px;padding-block:8px;padding-inline:6px 10px;min-height:46px;cursor:pointer;min-width:0}
.tog{appearance:none;border:0;background:transparent;width:30px;height:30px;display:grid;place-items:center;border-radius:5px;color:var(--ink-2);flex:none;padding:0}
.tog:hover{background:var(--surface)}
.tog .ic{transition:transform .15s}
.tog:dir(rtl) .ic{transform:scaleX(-1)}
.tog[aria-expanded="true"] .ic{transform:rotate(90deg)}
.tog[aria-expanded="true"]:dir(rtl) .ic{transform:rotate(90deg)}
.kindtag{font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:var(--surface);white-space:nowrap;flex:none}
.p-title{font:600 17px/1.3 var(--f-text);min-width:0;flex:0 1 auto}
.p-count{font:400 13px var(--f-mono);color:var(--ink-3);white-space:nowrap;flex:none}
.p-marks{display:flex;gap:5px;flex:none}
.panel-body{padding-block:0 8px;padding-inline:8px}
.panel.is-change{border-color:var(--chg-line)}
.panel.is-remove{background:var(--drop-bg);border-color:var(--drop-line)}
.panel.is-remove > .panel-head .p-title,.tabbody.is-remove > .gdetail .p-title{text-decoration:line-through;color:var(--ink-3)}
.panel.is-remove > .panel-body > :not(.gdetail),.tabbody.is-remove > :not(.gdetail){display:none}
.panel.is-added{border-style:dashed;border-color:var(--accent-line)}
.tabbody{min-width:0;scroll-margin-top:150px}
.gdetail{display:grid;grid-template-columns:minmax(0,1fr) var(--dec-w);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-block-end:8px;min-width:0}
.gdetail > .cnt{padding:10px 16px}
.is-change > .gdetail,.is-change > .panel-body > .gdetail{border-color:var(--chg-line)}
.is-change > .gdetail > .dec,.is-change > .panel-body > .gdetail > .dec{background:var(--chg-bg)}
.gsum{font:400 15px/1.55 var(--f-text);color:var(--ink-2)}
.adders{display:flex;gap:8px;flex-wrap:wrap;margin-block-start:8px}

/* ---------- cards ---------- */
.items{display:grid;gap:8px;min-width:0}
.items:empty{display:none}
.card{display:grid;grid-template-columns:46px minmax(0,1fr) var(--dec-w);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;scroll-margin-top:150px}
.card:focus{outline:0}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:12px;color:var(--ink-3);min-width:0}
.grip{appearance:none;border:0;background:transparent;padding:4px;border-radius:4px;color:var(--ink-3);cursor:grab;touch-action:none;display:grid}
.grip:hover{background:var(--surface-3);color:var(--ink)}
.num{font:500 13px/1 var(--f-mono);color:var(--ink-2)}
.qmark{font:600 15px/1 var(--f-mono);color:var(--accent)}
.cnt{padding-block:12px;padding-inline:2px 16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-block-end:6px;min-height:28px}
.kind{font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-bg);border-radius:4px;padding:4px 6px;white-space:nowrap}
.lbl{font:400 12px/1.2 var(--f-mono);color:var(--ink-3);overflow-wrap:anywhere;min-width:0}
.chip{font:500 12px/1 var(--f-ui);border-radius:4px;padding:4px 7px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.chip.c-new{color:var(--accent);border-color:var(--accent-line);background:var(--accent-bg)}
.chip.c-chg{color:var(--chg);border-color:var(--chg-line);background:var(--chg-bg)}
.chip.c-drop{color:var(--drop);border-color:var(--drop-line);background:var(--drop-bg)}
.chip.c-edit{display:none}
.is-edited > .cnt > .meta .c-edit,.is-edited > .panel-head .c-edit,.is-edited > .gdetail .c-edit{display:inline-block}
.idtag{font:400 11px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.title{font:600 17px/1.35 var(--f-text)}
.body{font:400 15px/1.6 var(--f-text);color:var(--ink-2);margin-block-start:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-block-start:8px}
.flag{display:inline-flex;gap:6px;align-items:flex-start;font-size:13px;border-radius:5px;padding:4px 8px;background:var(--surface-3);color:var(--ink-2);min-width:0;font-family:var(--f-text)}
.flag .ic{margin-top:2px}
.flag.warn{background:var(--chg-bg);color:var(--chg)}
.linkchip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:3px 8px;font-size:13px;color:var(--accent);display:inline-flex;gap:6px;align-items:center;max-width:100%;min-width:0}
.linkchip .lt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);min-width:0}
.deps:empty{display:none}
.deps{display:grid;gap:4px;margin-block-start:8px}
.fields{margin-block-start:10px;border-top:1px dashed var(--line);padding-block-start:6px}
.fields > summary{cursor:pointer;font-size:13px;color:var(--ink-3);list-style:none;display:inline-flex;gap:6px;align-items:center;border-radius:4px;padding:2px 4px}
.fields > summary::-webkit-details-marker{display:none}
.fields > summary .ic{transition:transform .15s}
.fields > summary:dir(rtl) .ic{transform:scaleX(-1)}
.fields[open] > summary .ic{transform:rotate(90deg)}
.fields[open] > summary:dir(rtl) .ic{transform:rotate(90deg)}
.field{margin-block-start:8px}
.flabel{font:500 12px/1.3 var(--f-ui);color:var(--ink-3);margin-block-end:2px;text-align:start}
.fval{font:400 14px/1.55 var(--f-text);color:var(--ink-2)}
.anote{margin-block-start:8px;border:1px solid var(--accent-line);background:var(--accent-bg);border-radius:6px;padding:6px 10px;font:400 13.5px/1.5 var(--f-text);text-align:start}
.anote b{font:600 12px var(--f-ui);color:var(--accent);margin-inline-end:8px;white-space:nowrap}

/* choices */
.choices{margin-block-start:8px;border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;background:var(--surface-2)}
.cprompt{font:500 15px/1.5 var(--f-text)}
.opts{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.opt{display:flex;gap:8px;align-items:flex-start;min-width:0}
.mark{appearance:none;flex:none;width:22px;height:22px;margin-block-start:3px;border-radius:50%;border:1.5px solid var(--ink-3);background:var(--surface);display:grid;place-items:center;color:transparent;padding:0}
.mark .ic{width:13px;height:13px;stroke-width:2.4}
.mark[aria-pressed="true"]{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.polldot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ink-3);margin-block-start:10px;margin-inline:7px}
.otext{flex:1 1 auto;min-width:0;font:400 14.5px/1.5 var(--f-text)}
.opt.is-correct .otext{color:var(--ok);font-weight:500}
.opt .iconbtn{width:24px;height:24px;opacity:.6}
.opt .iconbtn:hover{opacity:1}

/* figure */
.fig{margin:10px 0 0;display:flex;gap:10px;align-items:flex-start;min-width:0}
.figbtn{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px;flex:none;width:176px;cursor:zoom-in}
.figbtn img{display:block;width:100%;height:auto;border-radius:3px}
.fig figcaption{font:400 13px/1.5 var(--f-text);color:var(--ink-3);min-width:0;text-align:start}

/* decision column */
.dec{padding:12px;border-inline-start:1px solid var(--line-2);background:var(--surface-2);border-start-end-radius:var(--r);border-end-end-radius:var(--r);min-width:0;display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.segb{appearance:none;border:0;background:transparent;padding:8px 4px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:500;font-size:14px;min-width:0}
.segb + .segb{border-inline-start:1px solid var(--line)}
.segb .ic{display:none}
.segb[aria-pressed="true"] .ic{display:block}
.segb.s-accept{color:var(--ok)} .segb.s-change{color:var(--chg)} .segb.s-remove{color:var(--drop)}
.segb[aria-pressed="false"]:not(:disabled):hover{background:var(--surface-3)}
.segb[aria-pressed="true"]{font-weight:600}
.segb.s-accept[aria-pressed="true"]{background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok-line)}
.segb.s-change[aria-pressed="true"]{background:var(--chg-bg);box-shadow:inset 0 0 0 1px var(--chg-line)}
.segb.s-remove[aria-pressed="true"]{background:var(--drop-bg);box-shadow:inset 0 0 0 1px var(--drop-line)}
.segb:focus-visible{outline-offset:-2px}
.ins{display:block;width:100%;min-height:36px;resize:none;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:7px 9px;font:400 14px/1.45 var(--f-text);color:var(--ink);text-align:start}
.ins::placeholder{color:var(--ink-3);font-family:var(--f-ui)}
.ins:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.ins.is-off{color:var(--ink-3);text-decoration:line-through}
.dlabel{font:600 13px var(--f-ui);color:var(--accent)}
.chipset{display:none;flex-wrap:wrap;gap:5px}
.dec:focus-within > .chipset,.card.is-change > .dec > .chipset,.is-change > .gdetail > .dec > .chipset,.is-change > .panel-body > .gdetail > .dec > .chipset,.is-added > .dec > .chipset{display:flex}
.qchip{appearance:none;border:1px dashed var(--ink-3);background:transparent;border-radius:999px;padding:3px 9px;font-size:12.5px;color:var(--ink-2)}
.qchip:hover{border-style:solid;background:var(--surface)}
.qchip[aria-pressed="true"]{border-style:solid;border-color:var(--chg-line);background:var(--surface);color:var(--chg);font-weight:500}
.dnote{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:flex-start}
.dnote.warn{color:var(--chg)}
.card.is-change{border-color:var(--chg-line)}
.card.is-change > .dec{background:var(--chg-bg)}
.card.is-remove{background:var(--drop-bg);border-color:var(--drop-line)}
.card.is-remove > .cnt > :not(.meta):not(.title):not(.deps){display:none}
.card.is-remove > .cnt > .title{text-decoration:line-through;color:var(--ink-3);font-weight:500}
.card.is-remove > .dec{background:transparent;border-color:var(--drop-line)}

.qd{grid-column:2;font:400 13.5px/1.5 var(--f-text);color:var(--ink-2)}
.rec{font:500 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ok);margin-inline-start:8px;white-space:nowrap}

/* ---------- rail and summary ---------- */
.rail h2,.sum-h{font:600 14px var(--f-ui);margin-block-end:8px}
.sgrp{margin-block-start:12px}
.sgh{font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px;margin-block-end:4px}
.sgh.t-chg{color:var(--chg)} .sgh.t-drop{color:var(--drop)} .sgh.t-new{color:var(--accent)}
.mk{appearance:none;display:block;width:100%;text-align:start;border:0;background:transparent;border-radius:5px;padding:5px 6px;font-size:13.5px;min-width:0}

.mk .mt{font-family:var(--f-text);font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk .ms{display:block;color:var(--ink-3);font-family:var(--f-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.empty{color:var(--ink-3);font-size:13.5px}
.wlist{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.wlist li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--chg);background:var(--chg-bg);border:1px solid var(--chg-line);border-radius:6px;padding:6px 9px}

.bar-in{max-width:1568px;margin-inline:auto;display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.save{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2);min-width:0;flex:1 1 200px}
.save .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.save.is-ok .dot{background:var(--ok)}
.save.is-busy .dot{background:var(--chg);animation:cprpulse 1s infinite}
.save.is-local .dot{background:var(--chg)}
.save.is-bad .dot{background:var(--drop)}

.save.is-done{color:var(--ok);font-weight:600}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.count{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 9px;font-size:13px;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.count b{font:600 13px var(--f-mono);color:var(--ink)}
.count.c-chg b{color:var(--chg)} .count.c-drop b{color:var(--drop)} .count.c-new b{color:var(--accent)}

.bar-acts{display:flex;gap:8px;margin-inline-start:auto}

/* ---------- dialogs, menu, toast ---------- */
.dlg{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(680px,calc(100vw - 32px));max-height:min(86vh,900px);box-shadow:var(--shadow);overflow:hidden}
.dlg[open]{display:flex;flex-direction:column}
.dlg::backdrop{background:var(--scrim)}
.dlg-h{padding:16px 18px 12px;font:600 18px var(--f-ui);border-bottom:1px solid var(--line-2);flex:none}
.dlg-b{padding:14px 18px;overflow:auto;flex:1 1 auto;min-height:0}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center;flex:none}
.dlg-fig{width:min(1100px,calc(100vw - 32px))}
.dlg-fig img{display:block;width:100%;height:auto;background:var(--paper);border-radius:6px}
.dlg textarea.dump{display:block;width:100%;height:min(46vh,380px);font:12.5px/1.45 var(--f-mono);border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:8px;resize:vertical}
.menu{position:absolute;z-index:60;min-width:230px;max-width:min(360px,calc(100vw - 24px));max-height:min(60vh,460px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px}
.mi{appearance:none;display:flex;gap:9px;align-items:center;width:100%;text-align:start;border:0;background:transparent;border-radius:5px;padding:8px 10px;font-size:14px;min-width:0}

.mi:hover:not(:disabled),.mi:focus-visible{background:var(--surface-3);outline:0}
.mi.danger{color:var(--drop)}
.msep{height:1px;background:var(--line-2);margin:4px 2px}
.mhead{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:6px 10px 4px}

}

}

.anote .txt{flex:1 1 200px;min-width:0}
.fig figcaption{display:grid;gap:2px}
.kindsel{font:500 12px/1 var(--f-ui);border:1px solid var(--accent-line);border-radius:4px;background:var(--accent-bg);color:var(--accent);padding:3px 4px;max-width:150px}
.main.is-filtered .grip{visibility:hidden}
.dep{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--chg);background:var(--chg-bg);border-radius:5px;padding:4px 8px;text-align:start}

.linkchip.is-gone{border-color:var(--drop-line);color:var(--drop)}

.frow .fi{font-family:var(--f-text);color:var(--ink-2);overflow-wrap:anywhere;white-space:pre-wrap}
.frow .fi.none{color:var(--chg);font-family:var(--f-ui)}
.exnote{font-size:14px;color:var(--ink-2);margin-block-end:10px}
.keys{font-size:12.5px;color:var(--ink-3);margin-block-start:14px;border-top:1px solid var(--line-2);padding-block-start:10px}

  if (empties.length) warn(plural(empties.length, 'card has', 'cards have') + ' an empty answer option.', empties[0]);
  if (warns.length) kids.push(h('ul', {class: 'wlist'}, warns));
  sec('To change', m.change, function (id) { return insOf(id).trim(); });
  sec('Removed', m.remove, function (id) { return insOf(id).trim() || null; });
  sec('Added', m.added, function (id) { return insOf(id).trim() || null; });
  sec('Edited by you', m.edited, null);
  other = m.answers.filter(function (a) { return a.mine || a.note; });
  if (m.answers.length) {
    kids.push(h('div', {class: 'fsec'}, h('h3', {text: 'Answers to Claude\'s questions (' + m.answers.length + ')'}),
      other.map(function (a) { return h('div', {class: 'frow'}, h('div', {class: 'ft', dir: 'auto', text: a.question}), h('div', {class: 'fi', dir: 'auto', text: a.label + (a.note ? '\n' + a.note : '')})); }),
      h('div', {class: 'frow'}, h('div', {class: 'fi', text: other.length ? (m.answers.length - other.length) + ' more keep the recommended answer.' : 'All keep the recommended answer.'}))));
  }
  if ((S.planInstruction || '').trim()) kids.push(h('div', {class: 'fsec'}, h('h3', {text: 'For the whole plan'}), h('div', {class: 'frow'}, h('div', {class: 'fi', dir: 'auto', text: S.planInstruction.trim()}))));
  if (rework) {
    var cb = h('input', {type: 'checkbox', id: 'second-look'});
    cb.checked = PLAN.secondLookDefault !== false;
    kids.push(h('label', {class: 'checkrow', for: 'second-look'}, cb, h('span', {text: 'Show me the reworked and new cards on this page before anything is built'})));
  }
  setKids($('finish-body'), kids);
  openDlg($('dlg-finish'));
}
function confirmFinish() {
  var m = marks(), cb = $('second-look');
  S.finish = {at: nowIso(), secondLook: needsRework(m) ? !!(cb && cb.checked) : false};
  UI.reopened = false; TELL.sent = ''; TELL.msg = '';
  touch(true);
  if (MODE === 'db') flush();
  closeDlg($('dlg-finish'));
  paintFinishBtn(); renderNotices(); checkTell();
  window.scrollTo({top: 0, behavior: REDUCED ? 'auto' : 'smooth'});
}
function reopen() { if (S.finish) touch(); }

/* ---------- telling Claude (a wake-up only: the saved review is what counts) ---------- */
function tellKind() {
  if (TELL.room === 'available' && ROOM && !TELL.blocked.room) return 'room';
  if (TELL.comments === 'available' && COMMENTS && !TELL.blocked.comments) return 'comments';
  return '';
}
function checkTell() {
  var ask = function (ns, fn) {
    if (!ns || typeof ns[fn] !== 'function') return Promise.resolve('');
    return Promise.resolve().then(function () { return ns[fn](); }).then(function (v) { return typeof v === 'string' ? v : ''; }, function () { return ''; });
  };
  return Promise.all([ask(ROOM, 'canSendToClaudeSession'), ask(COMMENTS, 'canSendToClaude')]).then(function (r) {
    var before = tellKind();
    TELL.room = r[0]; TELL.comments = r[1];
    if (before !== tellKind() && S.finish) renderNotices();
  });
}
function told(ok, msg) { TELL.busy = false; TELL.sent = ok ? 'ok' : 'fail'; TELL.msg = msg; renderNotices(); }
function tell() {
  var m = LAST || marks(), kind = tellKind(), p, text, go;
  if (!S.finish || !kind || TELL.busy) return;
  TELL.busy = true;
  var failed = function (err) {
    var code = (err && err.code) || '';
    if (code === 'forbidden' || LIFECYCLE[code]) TELL.blocked[kind] = 1;
    told(false, (code === 'rate_limited' ? 'Too many sends just now. ' : 'That did not go through. ') + 'Tell Claude in the conversation that the review is done.');
    checkTell();
  };
  if (kind === 'room') {
    try {
      p = ROOM.sendToClaudeSession({label: 'Plan review finished', event: 'plan_review_finished', planId: String(PLAN.id), round: ROUND, savedDocument: 'review/r' + ROUND,
        toChange: m.change.length, removed: m.remove.length, added: m.added.length, edited: m.edited.length, secondLook: !!S.finish.secondLook,
        note: 'The owner finished the plan review on this page. The marks are saved in the page database document review/r' + ROUND + '. Read them and apply them with the content-plan-review skill.'},
        {deliver: 'send'});
    } catch (e) { p = Promise.reject(e); }
    Promise.resolve(p).then(function () { told(true, 'Handed to Claude. Confirm the send if you are asked, then look at the conversation.'); }, failed);
    return;
  }
  text = 'Plan review finished for ' + PLAN.id + ', round ' + ROUND + '. The marks are saved in the page database document review/r' + ROUND + ' (' + m.change.length + ' to change, ' +
    m.remove.length + ' removed, ' + m.added.length + ' added, ' + m.edited.length + ' edited). Read the saved review and apply it with the content-plan-review skill.';
  go = function (a) { return COMMENTS.sendToClaude({anchor: a, text: text}); };
  try { p = Promise.resolve(COMMENTS.anchorFor(elHdr)).then(go); } catch (e) { p = Promise.reject(e); }
  Promise.resolve(p).then(function () { told(true, 'Sent to Claude as a comment on this page.'); }, failed);
}

/* ---------- notices ---------- */
function notice(tone, ic, parts, acts, status) {
  var n = h('div', {class: 'notice ' + tone}, icon(ic), h('div', {class: 'ntext'}, parts));
  if (acts && acts.length) n.appendChild(h('div', {class: 'acts'}, acts));
  if (status) n.appendChild(h('div', {class: 'nstatus', text: status}));
  return n;
}
function nbtn(label, act, ic, primary) { return h('button', {class: 'btn sm' + (primary ? ' primary' : ''), type: 'button', 'data-act': act}, ic ? icon(ic) : null, label); }
function bold(t) { return h('b', {text: t}); }
function renderNotices() {
  var out = [], keep = LOCAL_OK ? 'They are kept in this browser. ' : 'They are not being kept anywhere. ';
  var keepM = LOCAL_OK ? 'Your marks are kept in this browser. ' : 'Your marks are not being kept anywhere. ';
  var hand = 'When you are done, use Download or Copy at the bottom and give the result to Claude.', saved, acts;
  if (!READY) { setKids(elNotices, out); return; }
  if (PLAN.approved) out.push(notice('ok', 'check', [bold('This plan is approved. '), 'Marks made here are saved, and Claude acts on them only when you say so.']));
  if (MODE === 'file') out.push(notice('info', 'info', [bold('This copy of the page is not connected to its storage. '), keepM + hand]));
  else if (MODE === 'readonly') out.push(notice('warn', 'warn', [bold('This account cannot save marks on this page. '), keep + hand + ' Opening the page with the account that owns it saves them directly.'], [nbtn('Download', 'download', 'down')]));
  else if (MODE === 'local') out.push(notice('warn', 'warn', [bold('Your marks are not reaching the page\'s storage. '), keep + hand], [DOC ? nbtn('Try again', 'retry-save', 'undo') : null, nbtn('Download', 'download', 'down')]));
  else if (MODE === 'db' && SAVE.err === 'too_big') out.push(notice('warn', 'warn', [bold('The review is too large to save. '), keepM + 'Shorten the longest instructions or edits, or use Download and give the file to Claude.'], [nbtn('Download', 'download', 'down')]));
  else if (MODE === 'db' && SAVE.err) out.push(notice('warn', 'warn', [bold('The last save did not go through. '), keepM + 'Try again, or use Download and give the file to Claude.'], [nbtn('Try again', 'retry-save', 'undo'), nbtn('Download', 'download', 'down')]));
  else if (MODE === 'db' && SAVE.size > WARN_AT) out.push(notice('warn', 'warn', [bold('The review is getting large. '), 'It still saves. Shorter instructions keep it that way.']));
  if (ROUND > 1 && REWORKED) out.push(notice('info', 'info', [bold('Round ' + ROUND + '. '), plural(REWORKED, 'card was', 'cards were') + ' reworked or drafted by Claude and carry a tag. The rest is as you left it.'], [nbtn('Show only those', 'filter-reworked')]));
  if (HAS_TABS && QUESTIONS.length && !S.finish && !UI.seenQ && activeTab() !== QTAB) out.push(notice('info', 'info', [bold('Claude has ' + plural(QUESTIONS.length, 'question', 'questions') + ' for you. '), 'The recommended answer is already selected on each.'], [nbtn('Go to the questions', 'goto-questions')]));
  if (S.finish) {
    if (MODE === 'db' && !SAVE.err) {
      saved = !SAVE.dirty && !SAVE.busy; acts = [];
      if (saved && tellKind() && TELL.sent !== 'ok') acts.push(nbtn('Tell Claude now', 'tell', 'send', true));
      out.push(notice('ok', 'check', [bold(saved ? 'Review finished and saved. ' : 'Review finished. Saving. '),
        TELL.sent === 'ok' ? TELL.msg : 'Go back to the conversation and tell Claude the review is done.'], acts, TELL.sent === 'fail' ? TELL.msg : ''));
    } else out.push(notice('warn', 'warn', [bold('Review finished, but it is not saved to the page. '), 'Use Download or Copy and give the result to Claude.'], [nbtn('Download', 'download', 'down'), nbtn('Copy', 'copy', 'copy')]));
  } else if (UI.reopened) out.push(notice('warn', 'warn', [bold('The review is open again. '), 'Press Finish review when you are done, so Claude knows it is complete.']));
  setKids(elNotices, out);
}

/* ---------- events ---------- */
var QT = 0;
function paintTabTitle(gid) {
  var t = $('tab-' + gid), sp = t && t.querySelector('.txt'), v = titleOf(gid) || 'Untitled';
  if (sp) { sp.textContent = ''; fill(sp, v); setDir(sp, v); t.setAttribute('title', v); }
}
document.addEventListener('mousedown', function (e) { if (e.target instanceof Element && e.target.closest('.qchip')) e.preventDefault(); });
document.addEventListener('click', function (e) {
  var t = e.target instanceof Element ? e.target : null, a, act, id, val, head, pb, btn, el, d;
  if (!t) return;
  if (!elMenu.hidden && !t.closest('#menu') && !t.closest('[data-act="menu"]')) closeMenu(false);
  a = t.closest('[data-act]'); if (!a || a.disabled) return;
  act = a.getAttribute('data-act'); id = a.getAttribute('data-for'); val = a.getAttribute('data-val');
  switch (act) {
    case 'status': setStatus(id, val); break;
    case 'chip': toggleChip(id, val); break;
    case 'edit':
      head = a.closest('.panel-head');
      if (head) { pb = $('pb-' + head.getAttribute('data-for')); if (pb && pb.hidden) { togglePanel(head.getAttribute('data-for')); break; } }
      if (window.getSelection && String(window.getSelection())) break;
      startEdit(a); break;
    case 'menu': if (MENU && MENU.btn === a) closeMenu(false); else openMenu(a, id); break;
    case 'toggle': if (t.closest('.ed[data-editing]')) break; togglePanel(id); break;
    case 'tab': setTab(id); break;
    case 'goto-questions': UI.seenQ = true; jumpTo(QUESTIONS[0].id); renderNotices(); break;
    case 'add-item': closeMenu(false); addItem(id, null); break;
    case 'add-group': addGroup(id, null); break;
    case 'del': closeMenu(false); deleteAdded(id); break;
    case 'jump': d = a.closest('dialog'); if (d) closeDlg(d); closeMenu(false); jumpTo(id); break;
    case 'fig': openFigure(id); break;
    case 'opt-correct': optCorrect(id, val); break;
    case 'opt-del': optDel(id, val); break;
    case 'opt-add': optAdd(id); break;
    case 'filter': setFilter(val); break;
    case 'filter-reworked': if (UI.filter !== 'reworked') setFilter('reworked'); break;
    case 'expand-all': setAllCollapsed(false); break;
    case 'collapse-all': setAllCollapsed(true); break;
    case 'finish': openFinish(); break;
    case 'finish-confirm': confirmFinish(); break;
    case 'reopen': reopen(); break;
    case 'copy': doCopy(); break;
    case 'download': doDownload(); break;
    case 'retry-save': retrySave(); break;
    case 'tell': tell(); break;
    case 'dlg-close': closeDlg(a.closest('dialog')); break;
    case 'export-select': el = $('export-text'); try { el.focus(); el.select(); } catch (x) {} break;
    case 'm-add-below': closeMenu(false); addItem(struct().parent[id], id); break;
    case 'm-dup': closeMenu(false); addItem(struct().parent[id], id, id); break;
    case 'm-up': closeMenu(false); moveItem(id, -1); break;
    case 'm-down': closeMenu(false); moveItem(id, 1); break;
    case 'm-moveto': btn = MENU && MENU.btn; if (btn) openMenu(btn, id, 'moveto'); break;
    case 'm-into': closeMenu(false); moveTo(id, val, null); break;
    case 'm-body': closeMenu(false); UI.showBody[id] = 1; el = rerenderItem(id); el = el && el.querySelector('.body'); if (el) startEdit(el); break;
    case 'm-add-group': closeMenu(false); addGroup(struct().parent[id], id); break;
    case 'm-g-up': closeMenu(false); moveGroup(id, -1); break;
    case 'm-g-down': closeMenu(false); moveGroup(id, 1); break;
  }
});
document.addEventListener('input', function (e) {
  var t = e.target instanceof Element ? e.target : null, qid, a;
  if (!t) return;
  if (t.id === 'plan-ins') { grow(t); S.planInstruction = t.value; touch(); }
  else if (t.id === 'q') { UI.q = t.value; clearTimeout(QT); QT = setTimeout(function () { computeFilter(); renderTabs(); renderMain(); }, 160); }
  else if (t.classList.contains('qnote')) { grow(t); qid = t.getAttribute('data-q'); a = get(S.answers, qid) || {}; setAnswer(qid, a.choice, t.value); }
  else if (t.classList.contains('ins') && t.hasAttribute('data-for')) onIns(t);
});
document.addEventListener('change', function (e) {
  var t = e.target instanceof Element ? e.target : null, id, qid, a;
  if (!t) return;
  if (t.matches('input[type="radio"][data-q]')) { qid = t.getAttribute('data-q'); a = get(S.answers, qid) || {}; setAnswer(qid, t.value, a.note || ''); }
  else if (t.classList.contains('kindsel')) { id = t.getAttribute('data-for'); if (isAdded(id)) { S.added[id].kind = t.value; touch(); refreshCounts(); } }
});
function stepCard(el, dir) {
  var cards = Array.prototype.filter.call(elMain.querySelectorAll('.card'), function (c) { return c.offsetParent !== null; }), next = cards[cards.indexOf(el) + dir];
  if (next) { next.focus(); next.scrollIntoView({block: 'nearest'}); }
}
document.addEventListener('keydown', function (e) {
  var t = e.target instanceof Element ? e.target : null, items, i, id, card, code = e.code, ti;
  if (e.key === 'Escape') {
    if (!elMenu.hidden) { e.preventDefault(); closeMenu(true); }
    else if (t && t.classList.contains('ins') && t.hasAttribute('data-for')) { card = $('n-' + t.getAttribute('data-for')); if (card && card.classList.contains('card')) { try { card.focus({preventScroll: true}); } catch (x) {} } }
    return;
  }
  if (!t) return;
  if (!elMenu.hidden && t.closest('#menu')) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      items = Array.prototype.slice.call(elMenu.querySelectorAll('.mi:not(:disabled)'));
      i = (items.indexOf(document.activeElement) + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      if (items[i]) items[i].focus();
    }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (t.classList.contains('ed') && !t.hasAttribute('data-editing') && !t.classList.contains('is-locked') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); startEdit(t); return; }
  if (!t.classList.contains('card')) return;
  id = t.getAttribute('data-id');
  if (code === 'KeyJ' || e.key === 'ArrowDown') { e.preventDefault(); stepCard(t, 1); }
  else if (code === 'KeyK' || e.key === 'ArrowUp') { e.preventDefault(); stepCard(t, -1); }
  else if (t.getAttribute('data-type') !== 'item') return;
  else if (!isAdded(id) && (code === 'KeyA' || code === 'KeyC' || code === 'KeyR')) { e.preventDefault(); setStatus(id, code === 'KeyA' ? 'accept' : (code === 'KeyC' ? 'change' : 'remove')); }
  else if (code === 'KeyE' || e.key === 'Enter') { ti = t.querySelector('.title'); if (ti) { e.preventDefault(); startEdit(ti); } }
});
window.addEventListener('resize', function () { closeMenu(false); });
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && SAVE.dirty) flush(); });
window.addEventListener('pagehide', function () { if (SAVE.dirty) flush(); });

/* ---------- start ---------- */
elMain.setAttribute('dir', PLAN_DIR);
elWork.setAttribute('inert', '');
$('btn-finish').disabled = true;
renderHeader(); renderToolbar(); renderTabs(); renderMain(); paintSave();
GUARD = setTimeout(function () { if (!READY) { BLIND = true; MODE = 'local'; ready(); } }, 12000);
connect();
})();
</script>
